name: Build & Cross-Compile Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            name: windows-amd64
            wails-flags: ""
          - os: windows-latest
            platform: windows/arm64
            name: windows-arm64
            wails-flags: ""
          - os: macos-latest
            platform: darwin/universal
            name: macos-universal
            wails-flags: ""
          - os: ubuntu-latest
            platform: linux/amd64
            name: linux-amd64
            wails-flags: "-tags webkit2_41"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend Assets
        run: npm run build

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Compile Application with Wails
        run: wails build -platform ${{ matrix.platform }} ${{ matrix.wails-flags }} -clean

      - name: Package Windows Binary and Distribution Archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "build\bin\agent-cockpit.exe" "agent-cockpit-${{ matrix.name }}.exe"
          Compress-Archive -Path "build\bin\agent-cockpit.exe", "config.yaml", "README.md", "LICENSE" -DestinationPath "agent-cockpit-${{ matrix.name }}.zip"

      - name: Package macOS Universal Application
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/bin/agent-cockpit.app "agent-cockpit-${{ matrix.name }}.zip"

      - name: Package Linux Binary and Distribution Archive
        if: runner.os == 'Linux'
        run: |
          cp "build/bin/agent-cockpit" "agent-cockpit-${{ matrix.name }}"
          chmod +x "agent-cockpit-${{ matrix.name }}"
          cp config.yaml README.md LICENSE build/bin/
          tar -czvf "agent-cockpit-${{ matrix.name }}.tar.gz" -C build/bin agent-cockpit config.yaml README.md LICENSE

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-cockpit-${{ matrix.name }}
          path: agent-cockpit-${{ matrix.name }}*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: agent-cockpit-${{ matrix.name }}*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
